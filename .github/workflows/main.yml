name: Deploy to Surge

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install Surge
        run: npm install --global surge

      - name: Deploy to Surge
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          # Cambia el dominio abajo por tu dominio deseado (ej: bernardogomera.surge.sh)
          surge login --token $SURGE_TOKEN
          surge --project ./ --domain example-yourdomain.surge.sh
